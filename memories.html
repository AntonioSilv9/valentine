<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Us ❤️</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 15px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 15px;
      object-fit: cover;
    }

    p {
      color: #555;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Fizeste a escolha certaaaa❤️</h1>

    <div class="gallery">
      <img src="images/imageEstudio.PNG">
      <img src="images/imageJorge.jpg">
      <img src="images/imageMask.jpg">
      <img src="images/imageNight.jpg">
    </div>

    <p>
      Só alguns momentos com o meu amor para te lembrares do quanto eu gosto de ti 💖<br>
      Happy Valentine’s Day, coisa fofaaa 😘
    </p>
  </div>

</body>
</html>
