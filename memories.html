<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amo te ❤️</title>

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 15px;
    }

    .slideshow img {
      width: 100%;
      border-radius: 15px;
      object-fit: cover;
      opacity: 1;
      transition: opacity 1s ease;
    }

    #caption {
      margin-top: 10px;
      font-size: 16px;
      color: #555;
    }

    p {
      color: #555;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Fizeste a escolha certaaaa ❤️</h1>

    <div class="slideshow">
      <img id="slideImage" src="images/image1.PNG" alt="Us ❤️">
      <p id="caption">Primeira foto juntos 💖</p>
    </div>

    <p>
      Só alguns momentos com o meu amor para te lembrares do quanto eu gosto de ti 💖<br>
      Happy Valentine’s Day, coisa fofaaa 😘
    </p>
  </div>

  <script>
    const slides = [
      { src: "images/imageMask.jpg", text: "O que eu faço por ti!!" },
      { src: "images/imageEstudio.PNG", text: "Nós no nosso estudio💕" },
      { src: "images/imageJorge.jpg", text: "Em são jorge 😍" },
      { src: "images/imageNight.jpg", text: "Sempre lindos meu amor ❤️" },
      { src: "images/imageBaile.jpg", text: "O baile de final de curso do meu amor" },
      { src: "images/imageBube.jpg", text: "As nossas brincadeiras na nossa casinha de Coimbra" },
      { src: "images/imageCalhau.jpg", text: "Tomar um banhinho no calhau" },
      { src: "images/imageFesta.jpg", text: "" },
      { src: "images/imageFitas.jpg", text: "A minha bube a acabar o Cursooo" },
      { src: "images/imageQuinta.jpg", text: "Os nossos dias na quinta do abacate❤️" }
    ];

    let index = 0;
    const img = document.getElementById("slideImage");
    const caption = document.getElementById("caption");
    img.src = slides[0].src;
    caption.textContent = slides[0].text;
    setInterval(() => {
      img.style.opacity = 0;

      setTimeout(() => {
        index = (index + 1) % slides.length;
        img.src = slides[index].src;
        caption.textContent = slides[index].text;
        img.style.opacity = 1;
      }, 1000);
    }, 3500);
  </script>

</body>
</html>
