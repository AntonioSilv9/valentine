<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clica no não☺️</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      color: #ff4d6d;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #ddd;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my baby Ala on this Valentine's Day? ❤️</h1>
    <div class="photos">
      <img src="images/image1.PNG" alt="Us ❤️">
      <figcaption>Pode ser que esta foto te ajude a decidir☺️</figcaption>
      
      
    </div>
    <button id="yes" onclick="yesClicked()">SIM 💕</button>
    <button id="no" onmouseover="moveNo()">NÃO 💔</button>
  </div>

  <script>
    function yesClicked() {
      window.location.href = "memories.html";
    }

    function moveNo() {
      const no = document.getElementById("no");
      const x = Math.random() * (window.innerWidth - no.offsetWidth);
      const y = Math.random() * (window.innerHeight - no.offsetHeight);
      no.style.left = `${x}px`;
      no.style.top = `${y}px`;
    }
  </script>

</body>
</html>
